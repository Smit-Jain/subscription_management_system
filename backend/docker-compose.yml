services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_secret
      POSTGRES_DB: brightloop_dev
    ports:
      - "5432:5432"
    volumes:
      - brightloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brightloop_pgdata:
